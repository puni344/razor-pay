  rationale: "The merchant silently substituted the requested variant (Blue, Size M) with a different variant (Red, Size L) claiming stock unavailability. The user explicitly specified color and size. Even though the price remained the same, the delivered product would not match the user request on two attributes (color and size). The merchant is at fault for auto-substitution without genuine user consent. The agent should have detected the variant change and sought user confirmation rather than proceeding."
